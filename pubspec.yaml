name: arxdeus_lints
description: >-
  A strict, opinionated set of Dart and Flutter analysis options, adopted with
  one include line. Enables the three strict language modes and 212 lints.
  Ships no Dart code.
version: 1.0.0
homepage: https://github.com/arxdeus/arxdeus_lints
repository: https://github.com/arxdeus/arxdeus_lints
issue_tracker: https://github.com/arxdeus/arxdeus_lints/issues

# Ko-fi, mirrored by .github/FUNDING.yml which renders the Sponsor button on
# GitHub. pub.dev turns this into a "Funding" link on the package page.
funding:
  - https://ko-fi.com/arxdeus

topics:
  - lints
  - analysis
  - linter
  - static-analysis

environment:
  sdk: ^3.13.2

